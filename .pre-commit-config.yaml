# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# See https://docs.renovatebot.com/modules/manager/pre-commit/ for Renovate updates to frozen rev pins
repos:
  - repo: local
    hooks:
      - id: xdsl-stubgen
        name: generate xDSL type stubs
        entry: uv run xdsl-stubgen
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2 # frozen: v0.16.1
    hooks:
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 4923370d55631aa5b66f612f52d67b2e0ca2a38c # frozen: v3.9.1
    hooks:
      - id: prettier
        types_or: [yaml]
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 67cd950188cc8e2611e9ac21d1b032fdd446c601 # frozen: v2.28.0
    hooks:
      - id: pyproject-fmt
