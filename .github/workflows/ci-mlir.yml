# Test MLIR compatibility using the Nix development environment across Python versions.

name: CI - MLIR-based Testing

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Run the Actions script ({0}) in Nix.
        # -e exits on unhandled failures,
        # -o pipefail propagates failures from any command in a pipeline.
        shell: nix develop --command bash -eo pipefail {0}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      COLLECT_COVERAGE: ${{ matrix.python-version == '3.14' }}
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up virtual environment
        run: make venv

      - name: Test with pytest and generate code coverage
        run: |
          if [ "$COLLECT_COVERAGE" = "true" ]; then
            uv run pytest -W error --cov
          else
            uv run pytest -W error
          fi

      - name: Execute lit tests
        run: |
          # Add decoy executables that should be XDSL_ env vars in tests instead
          FAKE_BIN=$(mktemp -d)
          for tool in mlir-opt mlir-translate llvm-diff; do
            printf '%s\n' '#!/bin/sh' "echo \"bare $tool on PATH forbidden; use lit substitution\" >&2" 'exit 1' > "$FAKE_BIN/$tool"
            chmod +x "$FAKE_BIN/$tool"
          done
          export PATH="$FAKE_BIN:$PATH"
          if [ "$COLLECT_COVERAGE" = "true" ]; then
            uv run lit -v tests/filecheck/ -DCOVERAGE
            uv run lit -v docs/Toy/examples/ -DCOVERAGE
          else
            uv run lit -v tests/filecheck/
            uv run lit -v docs/Toy/examples/
          fi

      - name: Test MLIR dependent examples/tutorials
        run: make tests-marimo

      - name: Combine coverage data
        if: matrix.python-version == '3.14'
        run: |
          uv run coverage combine --append
          uv run coverage report
          uv run coverage xml

      - name: Prune uv cache
        run: uv cache prune --ci

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
          files: coverage.xml
          codecov_yml_path: codecov.yml
          token: ${{ secrets.CODECOV_TOKEN }}
