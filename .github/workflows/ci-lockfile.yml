# Ensures that the uv lockfile is up to date with pyproject.toml

name: CI - Lockfile

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package locally and check for lockfile mismatch
        run: |
          # Install all default extras.
          # Fail if the lockfile dependencies are out of date with pyproject.toml.
          uv sync --all-extras --all-groups --locked

      - name: Prune uv cache
        run: uv cache prune --ci
